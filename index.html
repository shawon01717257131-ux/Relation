<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHAWON ❤️ NUSAIBA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating Hearts -->
    <div class="hearts">
        <span>❤️</span>
        <span>💗</span>
        <span>💕</span>
        <span>💖</span>
        <span>💘</span>
        <span>❤️</span>
        <span>💞</span>
        <span>💗</span>
    </div>


    <main class="container">

        <!-- Teddy Couple -->
        <section class="teddy-section">

            <div class="teddy teddy-left">

                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>

                <div class="head">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>

                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>

                <div class="body"></div>

                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>

            </div>


            <div class="heart-between">
                ❤️
            </div>


            <div class="teddy teddy-right">

                <div class="ear left-ear"></div>
                <div class="ear right-ear"></div>

                <div class="head">
                    <div class="eye left-eye"></div>
                    <div class="eye right-eye"></div>

                    <div class="nose"></div>
                    <div class="mouth"></div>
                </div>

                <div class="body"></div>

                <div class="arm left-arm"></div>
                <div class="arm right-arm"></div>

            </div>

        </section>


        <!-- Names -->
        <section class="names-section">

            <div class="couple-names">
                <span>SHAWON</span>

                <b>+</b>

                <span>NUSAIBA</span>
            </div>

            <p class="start-date">
                Together since 18 February 2024
            </p>

        </section>


        <!-- Counter -->
        <section class="counter">

            <div class="time-box">
                <strong id="years">0</strong>
                <span>Years</span>
            </div>

            <div class="time-box">
                <strong id="months">0</strong>
                <span>Months</span>
            </div>

            <div class="time-box">
                <strong id="days">0</strong>
                <span>Days</span>
            </div>

            <div class="time-box">
                <strong id="hours">00</strong>
                <span>Hours</span>
            </div>

            <div class="time-box">
                <strong id="minutes">00</strong>
                <span>Minutes</span>
            </div>

            <div class="time-box">
                <strong id="seconds">00</strong>
                <span>Seconds</span>
            </div>

        </section>


        <!-- Caption -->
        <section class="message">

            <h2>Our Beautiful Journey ❤️</h2>

            <p>
                Every second with you is a beautiful memory.
                Here's to all the moments we've shared
                and all the moments still waiting for us.
            </p>

            <div class="love-line">
                SHAWON ❤️ NUSAIBA
            </div>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
